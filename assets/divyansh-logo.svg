<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DIVYANSH">
  <defs>
    <linearGradient id="dv-silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#d1d5db"/>
    </linearGradient>
    <radialGradient id="dv-aperture" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#9ca3af" stop-opacity="0.35"/>
    </radialGradient>
    <filter id="dv-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Celestial ring -->
  <circle cx="32" cy="32" r="29" fill="#0b0e14" fill-opacity="0.55" stroke="url(#dv-silver)" stroke-width="1.6"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="0.8"/>
  <!-- Monolith pillar -->
  <rect x="17" y="16" width="4.6" height="32" rx="1.2" fill="url(#dv-silver)"/>
  <!-- Geometric D arch -->
  <path d="M25.5 16.8 H31.5 A15.2 15.2 0 0 1 31.5 47.2 H25.5" fill="none" stroke="url(#dv-silver)" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- Inner glowing portal aperture -->
  <path d="M28.6 41 V27.6 A3.4 3.4 0 0 1 35.4 27.6 V41 Z" fill="url(#dv-aperture)" filter="url(#dv-glow)"/>
</svg>
